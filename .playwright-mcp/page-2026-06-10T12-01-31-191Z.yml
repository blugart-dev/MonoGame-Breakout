            - link "Super Breakout marquee" [ref=e168] [cursor=pointer]:
              - /url: /wiki/File:Super_Breakout_marquee.jpg
              - img "Super Breakout marquee" [ref=e169]
            - paragraph [ref=e170]:
              - text: Super Breakout is an arcade game which was released by
              - link "Atari" [ref=e171] [cursor=pointer]:
                - /url: /wiki/Atari
              - text: in
              - link "1978" [ref=e172] [cursor=pointer]:
                - /url: /wiki/1978
              - text: ; it utilizes a Motorola M6502 (running up at 375 KHz), and, as the name suggests, it is the sequel to
              - link "Breakout" [ref=e173] [cursor=pointer]:
                - /url: /wiki/Breakout
              - text: ", which was released two years earlier. There are three different modes to choose from: Double Breakout, the playfield for which contains in fifty-two orange blocks (5-14 points), fifty-two green blocks (1-6 points), two paddles and two balls, Cavity Breakout, which contains in forty-four orange blocks (7-21 points), and fifty-two green blocks (1-9 points), one paddle, and three balls (the second and third of which have to be freed before they come into play) and Progressive Breakout which contains fifty-two blue blocks (7 points) and fifty-two green blocks (5 points), one paddle, and one ball - and the blocks shall be lowered down towards the paddle, at a rate determined by the number of times the ball lands on your paddle, but as the ball destroys them, additional rows of blocks shall appear at the top of the screen and be lowered down towards the paddle at an increasing rate. This is also the only mode for which it's possible for a player to receive an infinite amount of points by playing, but the score display shall roll over at 10000."
