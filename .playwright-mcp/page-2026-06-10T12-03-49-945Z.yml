            - heading "Descriptions[edit | edit source]" [level=3] [ref=e163]:
              - text: Descriptions
              - generic [ref=e164]:
                - text: "["
                - link "edit" [ref=e165] [cursor=pointer]:
                  - /url: /w/index.php?title=Breakout_(Atari_2600)/Walkthrough&veaction=edit&section=3
                - text: "|"
