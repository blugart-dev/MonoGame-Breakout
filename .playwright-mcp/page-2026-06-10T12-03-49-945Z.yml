            - figure "Breakout" [ref=e84]:
              - link [ref=e85] [cursor=pointer]:
                - /url: /wiki/File:Breakout_2600_screen.png
                - img [ref=e86]
              - generic [ref=e87]: Breakout
            - list [ref=e88]:
              - listitem [ref=e89]: To begin, you must press the button to serve the ball. Then maneuver the on-screen paddle so that it remains beneath the ball as it approaches the bottom of the screen. When the ball hits the paddle, it will bounce back up to the top of the screen.
              - listitem [ref=e90]:
                - text: When the ball hits a brick, the brick is removed from the wall, and the ball will bounce back down to the bottom. Points are awarded for each brick removed, as described in the
                - link "Scoring" [ref=e91] [cursor=pointer]:
                  - /url: /wiki/Breakout_(Atari_2600)/Gameplay#Scoring
                - text: section.
              - listitem [ref=e92]: If you fail to catch the ball with the paddle, the ball will disappear along the bottom of the screen, and you must serve one of your remaining balls. If you run out of balls to serve, the game is over.
              - listitem [ref=e93]: The speed of the ball, and the possible return trajectories of the ball change after the 4th, 8th, and 12th hits from the paddle. When the ball hits the fourth row of bricks or higher, it automatically enters the fastest state that the ball can be in.
              - listitem [ref=e94]: If the ball breaks through the wall and touches the wall at the top of the screen, the size of your paddle will be reduced, making it harder to return the ball.
              - listitem [ref=e95]: If you manage to completely remove one wall, it will be replaced by a second wall after the ball is hit by the paddle. After you completely destroy the second wall, your game is over, regardless of how many balls you have remaining.
