name: Release

# Pushing a version tag (v1.0.0, v1.1.0, …) builds self-contained,
# playable folders for every desktop platform and attaches them to a
# GitHub Release — a player downloads an archive, unpacks, and runs the
# executable inside. No .NET SDK or runtime needed on their machine.
on:
  push:
    tags: ["v*"]

# `gh release create` below writes to the repo, which the default
# read-only GITHUB_TOKEN cannot do.
permissions:
  contents: write

jobs:
  release:
    # One Linux runner cross-publishes all four targets. This works because
    # (a) self-contained publishing is a NuGet operation — the per-platform
    # native libraries (SDL, OpenAL) ship inside MonoGame's package and the
    # RID picks which set lands in the output; and (b) DesktopGL .xnb content
    # is platform-agnostic, so content built once here runs everywhere.
    # A Linux host is also the only place the Linux/macOS archives can be
    # given a correct executable bit — a zip/tar made on Windows would
    # produce a binary that won't run after unpacking.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The game targets net9.0, but the MGCB content tools ship for net8.0,
      # so the build machine needs both runtimes (same as build.yml).
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      # The HUD spritefont is rasterized from Arial at build time — Linux
      # needs the MS core fonts package (same recipe as build.yml).
      - name: Install Microsoft core fonts
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y ttf-mscorefonts-installer
          sudo fc-cache -f

      # Effect (.fx) compilation runs Direct3D's shader compiler, which is
      # Windows-only — on Linux MGCB invokes it through Wine (same recipe
      # as build.yml).
      - name: Set up Wine for effect compilation
        run: |
          sudo apt-get install -y wine64 p7zip-full
          wget -qO- https://monogame.net/downloads/net9_mgfxc_wine_setup.sh | bash
          echo "MGFXC_WINE_PATH=$HOME/.winemonogame" >> $GITHUB_ENV

      # A release that doesn't match its own version number is worse than a
      # failed build — catch a tag/csproj mismatch before publishing anything.
      - name: Check the tag matches the csproj <Version>
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "<Version>$VERSION</Version>" Breakout.csproj \
            || { echo "Tag $GITHUB_REF_NAME does not match <Version> in Breakout.csproj"; exit 1; }

      # The gate: no green tests, no release.
      - name: Test
        run: dotnet test Tests/Breakout.Tests --configuration Release

      # Self-contained publish per runtime, exactly as the MonoGame packaging
      # guide recommends. Deliberately NOT single-file: MonoGame warns against
      # it (it is a self-extracting archive with slower startup and native-
      # library quirks), and the Content folder must sit beside the executable
      # anyway — so a plain folder per platform is both safer and no bulkier.
      - name: Publish all platforms
        run: |
          for rid in win-x64 linux-x64 osx-x64 osx-arm64; do
            dotnet publish Breakout.csproj --configuration Release \
              --runtime $rid --self-contained --output publish/$rid
          done

      # Each archive unpacks to a single named folder. Windows gets a zip;
      # Linux/macOS get tar.gz because it preserves the executable bit.
      - name: Package
        run: |
          mkdir dist
          for rid in win-x64 linux-x64 osx-x64 osx-arm64; do
            name="Breakout-$GITHUB_REF_NAME-$rid"
            cp -r publish/$rid "$name"
            if [ "$rid" = "win-x64" ]; then
              zip -qr "dist/$name.zip" "$name"
            else
              chmod +x "$name/Breakout"
              tar czf "dist/$name.tar.gz" "$name"
            fi
          done
          ls -l dist

      - name: Create the GitHub Release with builds attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Breakout $GITHUB_REF_NAME" --generate-notes
